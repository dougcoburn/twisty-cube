[package]
name = "cube-cli"
version = "0.1.0"
edition = "2021"
description = "Two-phase and optimal 3x3 cube solver"
license = "MIT"
repository = "https://github.com/dougcoburn/twisty-cube"

[lib]
name = "cube_cli"
path = "src/lib.rs"

[[bin]]
name = "cube-cli"
path = "src/main.rs"

[[bin]]
name = "cube-preview"
path = "src/bin/cube-preview.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"

[profile.dev]
# Table build and optimal IDA* are tight loops. Debug-unoptimized runs do not finish.
opt-level = 2
