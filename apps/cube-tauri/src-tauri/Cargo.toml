[package]
name = "cube-tauri"
version = "0.1.0"
description = "Desktop shell for the two-phase cube solver"
edition = "2021"

[lib]
name = "cube_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cube-cli = { path = "../../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
